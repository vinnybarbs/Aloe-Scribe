name: Dependency security audit
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
  push:
    paths: ["requirements*.txt", "requirements*.in"]
permissions:
  contents: read
jobs:
  pip-audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Mac dependency set
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r requirements-mac.txt --no-deps --strict || echo "::warning::vulnerabilities found in Mac set"
      - name: Audit Windows dependency set
        run: |
          pip-audit -r requirements-windows.txt --no-deps --strict || echo "::warning::vulnerabilities found in Windows set"
